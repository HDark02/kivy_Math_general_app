name: MathAfro Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 3.10.5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.5"

      # Java 17 pour Gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Dépendances système nécessaires à Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      # Installation de Buildozer et Cython
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.33"

      # Cache Buildozer
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Vérification du buildozer.spec
      - name: Check Buildozer configuration
        run: |
          test -f buildozer.spec
          echo "buildozer.spec trouvé."

      # Construction de l'APK
      - name: Build APK
        run: |
          yes | buildozer -v android debug

      # Upload de l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathAfro-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
